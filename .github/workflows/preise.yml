name: Preise aktualisieren und veröffentlichen

on:
  schedule:
    # Täglich 03:00 UTC = 04:00 Uhr deutscher Winterzeit (05:00 Uhr Sommerzeit).
    # Cardmarket erstellt die Preisliste nachts gegen 03:00 Uhr deutscher Zeit neu.
    - cron: "0 3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cardmarket-Daten laden
        run: node scripts/build-data.mjs
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js icon.svg data _site/
          # Professor-Bild: erste Bilddatei mit "professor" im Namen wird als professor.png veröffentlicht
          prof=$(ls | grep -i -m1 -E 'professor.*\.(png|jpe?g|webp)$' || true)
          if [ -n "$prof" ]; then cp "$prof" _site/professor.png; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
